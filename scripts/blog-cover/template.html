<!doctype html>
<!--
  Blog cover template (1685x920). Rendered by render.sh; everything comes from the query string:
    variant  stripes | stat | pitch | ballot | centered   (default stripes; centered is the pitch layout without the pitch)
    partner  path to the partner logo, relative to this file (required; repeat it for several organizations, the
             ballot crest shows the first)
    eyebrow  small label (default "Success stories"; "" hides it)
    title    display headline (default "Success stories"; "" hides it)
    stat     big figure for the stat variant (default "84%")
    label    caption under the stat figure (default "turnout")
    c1, c2   partner brand colours as hex (default blaugrana #004D98 / #A50044; centered glows with c2, dots with c1)
    highlight  a figure of the vote, "<figure> <label>" ("84% turnout", "1,160 penyes"): the figure is set large with
             its label under it; repeat it for two (by default voters and turnout, or another figure if turnout is low)
    photo    optional background photo for stripes/stat/centered, darkened; 1685px wide or more, or it goes soft
    filter   CSS filter applied to the photo (default "grayscale(0.2) contrast(1.08) brightness(0.72)"; "none" keeps a
             pre-treated photo as is)
    fit      centered only: full | panel | band | stage   (default full; where the photo sits: full bleed, rounded panel,
             edge-to-edge band, or a receding plane in the pitch's perspective)
    motif    centered only: rows | rings | none   (drawing behind the text; default rows, or none with a full or stage photo)
    badge    none | ring   (default none: the partner's brand disc fills the circle; ring puts a bare transparent mark
             inside a cream circle)
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../lib/fonts.css" />
    <style>

      :root {
        --bg: oklch(0.17 0.012 106);
        --ink: oklch(0.96 0.012 97);
        --muted: oklch(0.96 0.012 97 / 0.6);
        --cream: oklch(0.988 0.011 97);
        --green: oklch(0.62 0.09 158);
        --c1: #004d98;
        --c2: #a50044;
      }

      * {
        margin: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1685px;
        height: 920px;
        overflow: hidden;
      }
      body {
        position: relative;
        background: var(--bg);
        color: var(--ink);
        font-family: 'Hanken Grotesk', sans-serif;
      }
      .layer {
        position: absolute;
        inset: 0;
      }
      .photo {
        background-size: cover;
        background-position: center;
        filter: grayscale(0.2) contrast(1.08) brightness(0.72);
      }
      .grain {
        background-image: radial-gradient(oklch(1 0 0 / 0.06) 1px, transparent 1px);
        background-size: 6px 6px;
        opacity: 0.5;
      }
      /* the dot grain turns a photo to mush once the cover is shrunk to a blog card */
      .has-photo .grain {
        display: none;
      }

      /* ---- highlights: the vote's figures ("84% turnout"), the number big and its label under it. The blog card shows
         the cover at about a fifth of its size, so anything meant to be read there has to be this large ---- */
      .highlights {
        position: absolute;
        display: flex;
        --hl: 190px;
        --hl-label: 50px;
      }
      .highlights:empty {
        display: none;
      }
      .highlights .hl {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 0 72px;
        white-space: nowrap;
        text-shadow: 0 4px 40px oklch(0 0 0 / 0.6);
      }
      .highlights .hl + .hl {
        border-left: 3px solid oklch(1 0 0 / 0.28);
      }
      .highlights b {
        font-family: 'Fraunces', serif;
        font-weight: 500;
        font-size: var(--hl);
        line-height: 0.9;
        letter-spacing: -0.04em;
        color: var(--cream);
      }
      .highlights small {
        margin-top: -6px;
        font-size: var(--hl-label);
        font-weight: 600;
        color: var(--ink);
      }

      /* ---- shared lockup: both logos large enough to read on a blog card ---- */
      .lockup {
        position: absolute;
        display: flex;
        align-items: center;
        gap: 48px;
      }
      .lockup .logo {
        height: 120px;
        display: flex;
        align-items: center;
      }
      .lockup .logo img {
        height: 100%;
      }
      .lockup .vocdoni img {
        height: 112px;
      }
      /* the partner logo is the organization's own brand disc (assets/logos/logo_<org>_round.webp) filling the circle */
      .lockup .partners {
        display: flex;
        gap: 28px;
      }
      .lockup .partner {
        height: 172px;
        width: 172px;
        border-radius: 50%;
        overflow: hidden;
      }
      .lockup .partner img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .lockup .x {
        font-size: 60px;
        font-weight: 300;
        color: var(--muted);
      }
      /* badge=ring: a bare mark on a transparent background, shown inside a cream ring instead */
      .badge-ring .lockup .partner {
        background: var(--cream);
        display: grid;
        place-items: center;
        padding: 20px;
      }
      .badge-ring .lockup .partner img {
        width: auto;
        height: auto;
        max-height: 100%;
        max-width: 100%;
        object-fit: contain;
        mix-blend-mode: multiply;
      }

      .eyebrow {
        position: absolute;
        display: inline-flex;
        align-items: center;
        gap: 16px;
        font-size: 38px;
        font-weight: 600;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .eyebrow::before {
        content: '';
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: var(--green);
      }
      .eyebrow:empty,
      .title:empty {
        display: none;
      }
      .title {
        position: absolute;
        font-family: 'Fraunces', serif;
        font-weight: 500;
        font-size: 150px;
        line-height: 0.95;
        letter-spacing: -0.03em;
        max-width: 900px;
      }
      .url {
        position: absolute;
        right: 80px;
        bottom: 64px;
        font-size: 26px;
        font-weight: 500;
        color: var(--muted);
      }

      /* ---- variant: stripes (blaugrana band bleeding in from the right) ---- */
      .v-stripes .band {
        position: absolute;
        top: -200px;
        bottom: -200px;
        right: -260px;
        width: 760px;
        transform: skewX(-14deg);
        background: repeating-linear-gradient(90deg, var(--c1) 0 95px, var(--c2) 95px 190px);
        mask-image: linear-gradient(90deg, transparent, black 35%);
      }
      .v-stripes .band::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, oklch(0 0 0 / 0.25), transparent 40%, oklch(0 0 0 / 0.35));
      }
      .v-stripes .eyebrow {
        left: 128px;
        top: 96px;
      }
      .v-stripes .title {
        left: 124px;
        top: 300px;
      }
      .v-stripes .lockup {
        left: 128px;
        bottom: 72px;
      }

      /* ---- variant: stat (one huge figure) ---- */
      .v-stat .glow {
        background:
          radial-gradient(900px 600px at 75% 60%, color-mix(in oklch, var(--c2) 55%, transparent), transparent 65%),
          radial-gradient(700px 500px at 90% 10%, color-mix(in oklch, var(--c1) 60%, transparent), transparent 60%);
      }
      .v-stat .eyebrow {
        left: 128px;
        top: 96px;
      }
      .v-stat .stat {
        position: absolute;
        left: 112px;
        top: 160px;
        font-family: 'Fraunces', serif;
        font-weight: 400;
        font-size: 520px;
        line-height: 1;
        letter-spacing: -0.06em;
        color: var(--cream);
      }
      .v-stat .stat small {
        display: block;
        font-family: 'Hanken Grotesk', sans-serif;
        font-size: 40px;
        letter-spacing: 0;
        color: var(--muted);
        margin-top: -20px;
        margin-left: 20px;
      }
      .v-stat .lockup {
        right: 128px;
        bottom: 72px;
      }
      /* stat, stripes and ballot: smaller figures, left-aligned */
      .v-stat .highlights,
      .v-stripes .highlights,
      .v-ballot .highlights {
        left: 128px;
        --hl: 110px;
        --hl-label: 40px;
      }
      .v-stat .highlights .hl,
      .v-stripes .highlights .hl,
      .v-ballot .highlights .hl {
        align-items: flex-start;
        padding: 0 56px;
      }
      .v-stat .highlights .hl:first-child,
      .v-stripes .highlights .hl:first-child,
      .v-ballot .highlights .hl:first-child {
        padding-left: 0;
      }
      .v-stat .highlights {
        bottom: 72px;
      }
      .v-stripes .highlights,
      .v-ballot .highlights {
        bottom: 300px;
      }
      /* pitch and centered: the figures are the centre of the cover; the eyebrow and title move up to make room */
      .v-pitch .highlights,
      .v-centered .highlights {
        left: 50%;
        top: 282px;
        transform: translateX(-50%);
      }
      .has-highlights.v-pitch .eyebrow,
      .has-highlights.v-centered .eyebrow {
        top: 60px;
      }
      .has-highlights.v-pitch .title,
      .has-highlights.v-centered .title {
        top: 122px;
        font-size: 104px;
      }
      .has-highlights.v-pitch .lockup,
      .has-highlights.v-centered .lockup {
        bottom: 60px;
      }
      .v-stat .url {
        display: none;
      }

      /* ---- variant: pitch (stylised football pitch, top-down) ---- */
      .v-pitch {
        background: radial-gradient(1200px 900px at 50% 120%, oklch(0.32 0.07 155), var(--bg) 70%);
      }
      .v-pitch .pitch {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 1400px;
        height: 900px;
        transform: translate(-50%, -32%) perspective(1400px) rotateX(48deg);
        border: 3px solid oklch(1 0 0 / 0.22);
        border-radius: 6px;
        background:
          repeating-linear-gradient(90deg, oklch(1 0 0 / 0.025) 0 140px, transparent 140px 280px),
          linear-gradient(90deg, transparent 49.8%, oklch(1 0 0 / 0.22) 49.8% 50.2%, transparent 50.2%);
      }
      .v-pitch .pitch::before {
        content: '';
        position: absolute;
        left: 50%;
        top: 50%;
        width: 280px;
        height: 280px;
        border: 3px solid oklch(1 0 0 / 0.22);
        border-radius: 50%;
        transform: translate(-50%, -50%);
      }
      .v-pitch .pitch::after {
        content: '';
        position: absolute;
        inset: 0;
        background:
          linear-gradient(90deg, oklch(1 0 0 / 0.22) 3px, transparent 3px) 0 0 / 100% 100% no-repeat,
          linear-gradient(90deg, transparent calc(100% - 3px), oklch(1 0 0 / 0.22) 3px) 0 0 / 100% 100% no-repeat;
        mask-image: linear-gradient(180deg, transparent 26%, black 26% 74%, transparent 74%);
        background-size: 240px 100%;
        background-position:
          left center,
          right center;
      }
      .v-pitch .eyebrow {
        left: 50%;
        top: 110px;
        transform: translateX(-50%);
      }
      .v-pitch .title {
        left: 50%;
        top: 190px;
        transform: translateX(-50%);
        text-align: center;
        max-width: none;
        white-space: nowrap;
        font-size: 128px;
      }
      .v-pitch .lockup {
        left: 50%;
        bottom: 84px;
        transform: translateX(-50%);
      }
      .v-pitch .url {
        display: none;
      }

      /* ---- variant: centered (the pitch layout without the pitch; a motif or a photo behind) ---- */
      .v-centered {
        background: radial-gradient(1200px 900px at 50% 120%, color-mix(in oklch, var(--c2) 55%, var(--bg)), var(--bg) 70%);
      }
      .v-centered .motif {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 2200px;
        height: 1500px;
        transform: translate(-50%, -42%) perspective(1400px) rotateX(58deg);
        opacity: 0.5;
      }
      /* rows: the seats of an assembly seen from the back of the room, a few of them in the partner colour */
      .motif-rows .motif {
        background-image:
          radial-gradient(var(--c1) 6px, transparent 7px),
          radial-gradient(var(--c1) 6px, transparent 7px),
          radial-gradient(oklch(1 0 0 / 0.4) 6px, transparent 7px);
        background-size:
          392px 392px,
          392px 392px,
          56px 56px;
        background-position:
          84px 140px,
          280px 364px,
          28px 28px;
        mask-image:
          radial-gradient(50% 60% at 50% 60%, black 30%, transparent 100%),
          linear-gradient(180deg, transparent 20%, black 60%);
        mask-composite: intersect;
      }
      /* the front of the room: a thin line the rows face */
      .motif-rows .motif::before {
        content: '';
        position: absolute;
        left: 12%;
        right: 12%;
        top: 30%;
        height: 3px;
        background: oklch(1 0 0 / 0.6);
      }
      /* rings: an assembly in the round, the lockup at its centre */
      .motif-rings .motif {
        background: repeating-radial-gradient(circle at 50% 78%, transparent 0 147px, oklch(1 0 0 / 0.4) 147px 150px);
        mask-image: radial-gradient(45% 55% at 50% 78%, black 20%, transparent 100%);
      }
      /* dark only behind the title and the lockup, so the middle of the photo keeps its detail */
      .v-centered .veil {
        background: linear-gradient(
          180deg,
          oklch(0.17 0.012 106 / 0.85) 0%,
          oklch(0.17 0.012 106 / 0.55) 35%,
          oklch(0.17 0.012 106 / 0.4) 60%,
          oklch(0.17 0.012 106 / 0.85) 100%
        );
      }
      /* stage: the photo is the receding plane the pitch variant draws, fading into the dark at the far end */
      .v-centered.fit-stage .photo {
        inset: auto;
        left: 50%;
        top: 50%;
        width: 1400px;
        height: 620px;
        transform: translate(-50%, -46%) perspective(1400px) rotateX(52deg);
        border-radius: 6px;
        box-shadow: inset 0 0 0 3px oklch(1 0 0 / 0.22);
        mask-image: linear-gradient(180deg, transparent 0%, black 38%);
      }
      .v-centered.fit-panel .photo,
      .v-centered.fit-band .photo {
        inset: auto;
        top: 376px;
        height: 328px;
        box-shadow: inset 0 0 0 1px oklch(1 0 0 / 0.14);
      }
      .v-centered.fit-panel .photo {
        left: 50%;
        width: 1200px;
        transform: translateX(-50%);
        border-radius: 24px;
      }
      .v-centered.fit-band .photo {
        left: 0;
        right: 0;
      }
      .v-centered .eyebrow {
        left: 50%;
        top: 110px;
        transform: translateX(-50%);
      }
      .v-centered .title {
        left: 50%;
        top: 190px;
        transform: translateX(-50%);
        text-align: center;
        max-width: none;
        white-space: nowrap;
        font-size: 128px;
      }
      .v-centered .lockup {
        left: 50%;
        bottom: 84px;
        transform: translateX(-50%);
      }
      .v-centered .url {
        display: none;
      }

      /* ---- variant: ballot (tilted ballot card) ---- */
      .v-ballot .glow {
        background: radial-gradient(1000px 700px at 80% 50%, color-mix(in oklch, var(--c1) 45%, transparent), transparent 65%);
      }
      .v-ballot .card {
        position: absolute;
        right: 150px;
        top: 150px;
        width: 560px;
        height: 700px;
        background: var(--cream);
        border-radius: 28px;
        transform: rotate(7deg);
        box-shadow: 0 60px 100px -30px oklch(0 0 0 / 0.7);
        overflow: hidden;
        color: oklch(0.24 0.013 106);
        padding: 56px;
      }
      .v-ballot .card::before {
        content: '';
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 26px;
        background: repeating-linear-gradient(180deg, var(--c1) 0 70px, var(--c2) 70px 140px);
      }
      .v-ballot .card .crest {
        height: 150px;
        margin-left: 20px;
      }
      .v-ballot .card .crest img {
        height: 100%;
        mix-blend-mode: multiply;
      }
      .v-ballot .row {
        display: flex;
        align-items: center;
        gap: 24px;
        margin: 36px 0 0 20px;
      }
      .v-ballot .row .box {
        width: 56px;
        height: 56px;
        border: 4px solid oklch(0.24 0.013 106 / 0.35);
        border-radius: 12px;
        flex: none;
      }
      .v-ballot .row .line {
        height: 18px;
        border-radius: 9px;
        background: oklch(0.24 0.013 106 / 0.14);
        flex: 1;
      }
      .v-ballot .row.checked .box {
        border-color: var(--green);
        background: var(--green);
        position: relative;
      }
      .v-ballot .row.checked .box::after {
        content: '';
        position: absolute;
        left: 16px;
        top: 6px;
        width: 14px;
        height: 28px;
        border: solid var(--cream);
        border-width: 0 6px 6px 0;
        transform: rotate(45deg);
      }
      .v-ballot .url {
        display: none;
      }
      .v-ballot .eyebrow {
        left: 128px;
        top: 96px;
      }
      .v-ballot .title {
        left: 124px;
        top: 300px;
        max-width: 760px;
      }
      .v-ballot .lockup {
        left: 128px;
        bottom: 72px;
      }
    </style>
  </head>
  <body>
    <div class="layer photo" hidden></div>
    <div class="layer veil" hidden></div>
    <div class="layer glow"></div>
    <div class="band"></div>
    <div class="pitch"></div>
    <div class="motif"></div>
    <div class="layer grain"></div>

    <div class="card">
      <div class="crest"><img class="partner-img" alt="" /></div>
      <div class="row"><div class="box"></div><div class="line"></div></div>
      <div class="row checked"><div class="box"></div><div class="line"></div></div>
      <div class="row"><div class="box"></div><div class="line"></div></div>
    </div>

    <div class="eyebrow"></div>
    <div class="title"></div>
    <div class="stat"></div>
    <div class="highlights"></div>
    <div class="lockup">
      <div class="logo vocdoni"><img src="../../public/images/vocdoni_logotype_full_blank.svg" alt="" /></div>
      <div class="x">×</div>
      <div class="partners"><div class="logo partner"><img class="partner-img" alt="" /></div></div>
    </div>
    <div class="url">vocdoni.io</div>

    <script>
      const p = new URLSearchParams(location.search)
      const variant = p.get('variant') || 'stripes'
      document.body.classList.add('v-' + variant)
      const get = (k, d) => (p.has(k) ? p.get(k) : d)
      document.querySelector('.eyebrow').textContent = get('eyebrow', 'Success stories')
      document.querySelector('.title').textContent = variant === 'stat' ? '' : get('title', 'Success stories')
      document.querySelector('.stat').innerHTML = variant === 'stat' ? `${get('stat', '84%')}<small>${get('label', 'turnout')}</small>` : ''
      // one disc per partner in the lockup; the ballot crest shows the first
      const partners = p.getAll('partner')
      document.querySelector('.crest img').src = partners[0] || ''
      const disc = document.querySelector('.lockup .partner')
      partners.forEach((src, n) => {
        const el = n ? disc.parentNode.appendChild(disc.cloneNode(true)) : disc
        el.querySelector('img').src = src
      })
      if (p.get('c1')) document.documentElement.style.setProperty('--c1', p.get('c1'))
      if (p.get('c2')) document.documentElement.style.setProperty('--c2', p.get('c2'))
      for (const sel of ['.band', '.pitch', '.card']) {
        const want = { '.band': 'stripes', '.pitch': 'pitch', '.card': 'ballot' }[sel]
        document.querySelector(sel).hidden = variant !== want
      }
      const photo = p.get('photo')
      const fit = get('fit', 'full')
      document.body.classList.add('fit-' + fit, 'badge-' + get('badge', 'none'))
      // "84% turnout": the first word is the figure, the rest its label
      for (const text of p.getAll('highlight')) {
        const [figure, ...label] = text.split(' ')
        const hl = document.createElement('div')
        hl.className = 'hl'
        hl.append(Object.assign(document.createElement('b'), { textContent: figure }))
        hl.append(Object.assign(document.createElement('small'), { textContent: label.join(' ') }))
        document.querySelector('.highlights').append(hl)
        document.body.classList.add('has-highlights')
      }
      if (photo) {
        document.body.classList.add('has-photo')
        const el = document.querySelector('.photo')
        el.hidden = false
        el.style.backgroundImage = `url("${photo}")`
        if (p.has('filter')) el.style.filter = p.get('filter')
      }
      const motif = get('motif', photo && (fit === 'full' || fit === 'stage') ? 'none' : 'rows')
      document.body.classList.add('motif-' + motif)
      document.querySelector('.motif').hidden = variant !== 'centered' || motif === 'none'
      document.querySelector('.veil').hidden = !(variant === 'centered' && photo && fit === 'full')
    </script>
  </body>
</html>
