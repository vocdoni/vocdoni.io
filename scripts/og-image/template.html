<!doctype html>
<!--
  Default social share image (1200x630), the og:image of every page that sets none of its own. Rendered by render.sh.
  Brand rules in BRAND.md: cream surface, ink logo, the Fraunces headline, a signal-yellow eyebrow dot, green accents.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'Hanken Grotesk';
        font-weight: 100 900;
        src: url(../../public/fonts/files/hanken-grotesk-latin-wght-normal.woff2) format('woff2-variations');
      }
      @font-face {
        font-family: 'Fraunces';
        font-weight: 100 900;
        src: url(../../public/fonts/files/fraunces-latin-full-normal.woff2) format('woff2-variations');
      }

      :root {
        --cream: oklch(0.988 0.011 97);
        --cream-deep: oklch(0.936 0.033 97);
        --ink: oklch(0.24 0.013 106);
        --ink-muted: oklch(0.24 0.013 106 / 0.64);
        --line: oklch(0.24 0.013 106 / 0.1);
        --green: oklch(0.47 0.085 158);
        --green-wash: oklch(0.47 0.085 158 / 0.12);
        --signal: oklch(0.93 0.11 102);
      }

      * {
        margin: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        position: relative;
        background: var(--cream);
        color: var(--ink);
        font-family: 'Hanken Grotesk', sans-serif;
      }

      /* a soft green glow and a deeper cream band on the right, behind the card */
      .band {
        position: absolute;
        inset: 0 0 0 auto;
        width: 430px;
        background: radial-gradient(circle at 60% 45%, var(--green-wash), transparent 62%), var(--cream-deep);
      }

      .copy {
        position: absolute;
        left: 72px;
        top: 64px;
        bottom: 64px;
        width: 640px;
        display: flex;
        flex-direction: column;
      }
      /* the logo file is white; the mask paints it in ink */
      .logo {
        width: 265px;
        height: 57px;
        background: var(--ink);
        -webkit-mask: url(../../public/images/vocdoni_logotype_full_blank.svg) left center / contain no-repeat;
        mask: url(../../public/images/vocdoni_logotype_full_blank.svg) left center / contain no-repeat;
      }
      .eyebrow {
        margin-top: auto;
        display: flex;
        align-items: center;
        gap: 14px;
        font-size: 21px;
        font-weight: 600;
        letter-spacing: 0.11em;
        text-transform: uppercase;
        color: var(--ink-muted);
      }
      .eyebrow::before {
        content: '';
        width: 13px;
        height: 13px;
        border-radius: 50%;
        background: var(--signal);
        box-shadow: 0 0 0 5px oklch(0.93 0.11 102 / 0.35);
      }
      h1 {
        margin-top: 22px;
        font-family: 'Fraunces', serif;
        font-weight: 400;
        font-variation-settings:
          'SOFT' 100,
          'WONK' 0;
        font-size: 84px;
        line-height: 0.98;
        letter-spacing: -0.03em;
      }
      h1 em {
        font-style: normal;
        color: var(--green);
      }
      .url {
        margin-top: 30px;
        font-size: 24px;
        font-weight: 500;
        color: var(--ink-muted);
      }

      /* a verified-results card, the product in miniature as on the homepage hero */
      .card {
        position: absolute;
        right: 64px;
        top: 50%;
        width: 340px;
        transform: translateY(-50%) rotate(-2deg);
        padding: 28px;
        border-radius: 20px;
        border: 1px solid var(--line);
        background: var(--cream);
        box-shadow:
          0 24px 48px -16px oklch(0.24 0.013 106 / 0.22),
          0 2px 6px -2px oklch(0.24 0.013 106 / 0.12);
      }
      .card .head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--ink-muted);
      }
      .chip {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 5px 12px;
        border-radius: 999px;
        background: var(--green-wash);
        color: var(--green);
        letter-spacing: 0;
        text-transform: none;
        font-size: 15px;
      }
      .card h2 {
        margin: 18px 0 22px;
        font-family: 'Fraunces', serif;
        font-weight: 400;
        font-variation-settings:
          'SOFT' 100,
          'WONK' 0;
        font-size: 30px;
        line-height: 1.05;
        letter-spacing: -0.02em;
      }
      .row + .row {
        margin-top: 16px;
      }
      .row .label {
        display: flex;
        justify-content: space-between;
        font-size: 17px;
        font-weight: 500;
        margin-bottom: 7px;
      }
      .row .label b {
        font-weight: 700;
      }
      .bar {
        height: 10px;
        border-radius: 999px;
        background: var(--line);
        overflow: hidden;
      }
      .bar span {
        display: block;
        height: 100%;
        border-radius: inherit;
        background: oklch(0.24 0.013 106 / 0.35);
      }
      .row.win .bar span {
        background: var(--green);
      }
      .card .foot {
        margin-top: 22px;
        padding-top: 16px;
        border-top: 1px solid var(--line);
        font-size: 15px;
        color: var(--ink-muted);
      }
    </style>
  </head>
  <body>
    <div class="band"></div>

    <div class="copy">
      <div class="logo" role="img" aria-label="Vocdoni"></div>
      <div class="eyebrow">Open-source online voting</div>
      <h1>Secure digital voting you can <em>trust</em></h1>
      <div class="url">vocdoni.io</div>
    </div>

    <div class="card">
      <div class="head">
        Results
        <span class="chip">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
            <path d="M20 6 9 17l-5-5" />
          </svg>
          Verified
        </span>
      </div>
      <h2>Annual assembly 2026</h2>
      <div class="row win">
        <div class="label">Approve the budget <b>72%</b></div>
        <div class="bar"><span style="width: 72%"></span></div>
      </div>
      <div class="row">
        <div class="label">Reject <b>21%</b></div>
        <div class="bar"><span style="width: 21%"></span></div>
      </div>
      <div class="row">
        <div class="label">Abstain <b>7%</b></div>
        <div class="bar"><span style="width: 7%"></span></div>
      </div>
      <div class="foot">1,284 votes · 81% turnout</div>
    </div>
  </body>
</html>
