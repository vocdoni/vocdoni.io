name: Deploy to Netlify

# Single deploy target for every environment. The Netlify site, its public URL and every build-time
# value come from the GitHub environment selected below, so this file never hardcodes a site:
#
#   push to `lts`  -> `production`    -> vocdoni.io (the only indexable deploy)
#   push to `main` -> `develop`       -> dev site (a production deploy of *that* site)
#   pull request   -> `pull request`  -> deploy-preview-<n> alias on the preview site
#
# Each environment must define:
#   secret    NETLIFY_SITE_ID
#   variables NETLIFY_SITE_NAME, SITE_URL, GTM_ID, PLAUSIBLE_DOMAIN, RECAPTCHA_SITE_KEY
# NETLIFY_AUTH_TOKEN and the EMAILJS_* variables are repository-wide.

on:
  push:
    branches:
      - lts
      - main
  pull_request:
    branches:
      - main

concurrency:
  # Never cancel a branch deploy midway; superseded PR previews are worth cancelling.
  group: deploy-netlify-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: ${{ github.event_name == 'pull_request' && 'pull request' || (github.ref_name == 'lts' && 'production' || 'develop') }}
      url: ${{ steps.netlify_url.outputs.site_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.33.3'

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The real Netlify deploy URL embeds a deploy id that only exists after upload, so it can't be
      # known at build time. Branch deploys use the environment's SITE_URL; PRs pin a deterministic
      # deploy *alias* whose URL we can compute up front and bake into SITE_URL, so
      # canonical/og:image/etc. point at the host that actually serves this deploy's assets -
      # otherwise shared preview links resolve to production, where a PR's new posts/images don't
      # exist yet. An unset value is a hard failure: falling back would bake the wrong canonical.
      - name: Resolve Netlify deploy URL
        id: netlify_url
        env:
          NETLIFY_SITE_NAME: ${{ vars.NETLIFY_SITE_NAME }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            if [ -z "${NETLIFY_SITE_NAME}" ]; then
              echo "::error::NETLIFY_SITE_NAME is not set for this environment"
              exit 1
            fi
            alias="deploy-preview-${{ github.event.number }}"
            site_url="https://${alias}--${NETLIFY_SITE_NAME}.netlify.app"
          else
            if [ -z "${SITE_URL}" ]; then
              echo "::error::SITE_URL is not set for this environment"
              exit 1
            fi
            alias=""
            site_url="${SITE_URL%/}"
          fi
          echo "alias=${alias}" >> "$GITHUB_OUTPUT"
          echo "site_url=${site_url}" >> "$GITHUB_OUTPUT"

      - name: Build project
        run: pnpm build
        env:
          EMAILJS_PUBLIC_KEY: ${{ vars.EMAILJS_PUBLIC_KEY }}
          EMAILJS_SERVICE_ID: ${{ vars.EMAILJS_SERVICE_ID }}
          EMAILJS_TEMPLATE_ID: ${{ vars.EMAILJS_TEMPLATE_ID }}
          GTM_ID: ${{ vars.GTM_ID }}
          PLAUSIBLE_DOMAIN: ${{ vars.PLAUSIBLE_DOMAIN }}
          RECAPTCHA_SITE_KEY: ${{ vars.RECAPTCHA_SITE_KEY }}
          SITE_URL: ${{ steps.netlify_url.outputs.site_url }}
          # Only the production branch is indexable. Dev and preview deploys are production deploys
          # of their own Netlify site, so Netlify does not noindex them for us.
          NOINDEX: ${{ !(github.event_name == 'push' && github.ref_name == 'lts') }}

      # The deploy used to run through nwtgck/actions-netlify, which uploads via the `netlify` JS
      # client. That client only hashes static files and serverless functions - it has no notion of
      # edge functions, so it can never ship `netlify/edge-functions/`. The CLI can: with
      # `--no-build` it still bundles the directory declared in `netlify.toml` before uploading.
      # Everything else about the deploy is deliberately unchanged, see the two steps below.
      - name: Install Netlify CLI
        run: npm install --global netlify-cli@27.4.0

      - name: Deploy to Netlify
        id: deploy
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          # Pin the alias so the served URL matches the SITE_URL baked into the build above. Empty
          # on branch pushes, which serve the site's primary URL.
          DEPLOY_ALIAS: ${{ steps.netlify_url.outputs.alias }}
        run: |
          set -euo pipefail
          args=(deploy --no-build --dir=./dist/client --message='Deploy from GitHub Actions')
          if [ "${{ github.event_name }}" = "push" ]; then
            # Every branch push is a production deploy of whichever site the environment points at.
            args+=(--prod)
          else
            args+=("--alias=${DEPLOY_ALIAS}")
          fi
          # Deliberately no `--json`: it suppresses the CLI's own logging, including whatever it
          # reports when a deploy fails, which left a failure showing as nothing but `exit 2`. The
          # only thing the JSON gave us was the deploy URL, and the `Resolve Netlify deploy URL`
          # step above already computes that (it has to, to bake it into SITE_URL at build time),
          # so full logs are worth more here than machine-readable output.
          # If this ever fails with a bare `exit 2` and no explanation, it is the edge-function
          # bundler: netlify-cli runs it with `buffer: true` and drops the buffered logs, so the
          # reason never reaches CI. Reproduce locally with `netlify build --offline`, which runs
          # the same core steps and prints the real error.
          netlify --version
          netlify "${args[@]}"

        timeout-minutes: 10

      # Replaces the PR/commit comments the action used to post. Same shape: one comment per site on
      # the PR, rewritten in place on every push instead of piling up, plus a commit comment. A
      # comment failure must never fail a deploy that already succeeded.
      - name: Comment the deploy URL
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          IS_PRODUCTION: ${{ github.event_name == 'push' }}
          SITE_URL: ${{ steps.netlify_url.outputs.site_url }}
        with:
          script: |
            const identifier = '<!-- netlify deploy comment -->'
            const { IS_PRODUCTION, SITE_URL } = process.env
            // SITE_URL is the URL this deploy actually serves from: the environment's site on a
            // branch push, the pinned deploy-preview alias on a PR. It is the same value baked
            // into the build, so a link from here always resolves to this deploy's own assets.
            const body = [
              identifier,
              IS_PRODUCTION === 'true' ? `Published on ${SITE_URL} as production.` : `Preview available at ${SITE_URL}`,
            ].join('\n')
            const { owner, repo } = context.repo

            await github.rest.repos.createCommitComment({ owner, repo, commit_sha: context.sha, body })

            if (context.issue.number === undefined) return
            const issue_number = context.issue.number
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number })
            const existing = comments.find((comment) => comment.body?.includes(identifier))
            if (existing) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body })
            else await github.rest.issues.createComment({ owner, repo, issue_number, body })
