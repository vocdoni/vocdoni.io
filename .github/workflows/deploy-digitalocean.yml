name: Deploy to DigitalOcean

# Production deploy. The app spec (including the legacy-redirect ingress rules generated from
# lib/legacyRedirects.ts) is applied via DigitalOcean's official app_action, which substitutes the
# ${VAR} env placeholders in .do/app.template.yaml from the environment defined below.
#
# Required GitHub repository secrets:
#   DIGITALOCEAN_ACCESS_TOKEN
# Required GitHub repository variables (public, build-time values):
#   EMAILJS_PUBLIC_KEY, EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID,
#   GTM_ID, PLAUSIBLE_DOMAIN, RECAPTCHA_SITE_KEY, SITE_URL
#
# `deploy_on_push` is set to false in the spec template so this action is the only thing that
# deploys the app (no double deploys).

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-digitalocean
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://vocdoni.io
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.33.3'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate app spec (inject redirect rules from lib/legacyRedirects.ts)
        # --silent keeps pnpm's lifecycle banner off stdout; without it the `> @ gen:do-appspec ...`
        # banner lands in the file and DigitalOcean's YAML parser fails on the leading `>` (line 2).
        run: pnpm --silent gen:do-appspec > .do/app.generated.yaml

      - name: Deploy to DigitalOcean App Platform
        uses: digitalocean/app_action/deploy@v2
        env:
          EMAILJS_PUBLIC_KEY: ${{ vars.EMAILJS_PUBLIC_KEY }}
          EMAILJS_SERVICE_ID: ${{ vars.EMAILJS_SERVICE_ID }}
          EMAILJS_TEMPLATE_ID: ${{ vars.EMAILJS_TEMPLATE_ID }}
          GTM_ID: ${{ vars.GTM_ID }}
          PLAUSIBLE_DOMAIN: ${{ vars.PLAUSIBLE_DOMAIN }}
          RECAPTCHA_SITE_KEY: ${{ vars.RECAPTCHA_SITE_KEY }}
          SITE_URL: ${{ vars.SITE_URL }}
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          app_spec_location: .do/app.generated.yaml
          print_build_logs: true
          print_deploy_logs: true
