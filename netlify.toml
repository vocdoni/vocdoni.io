# Netlify configuration. Build settings stay in the Netlify UI; this file only
# adds the Keystatic admin function and its client-side routing.
#
# The Keystatic API function is auto-routed via its own `config.path`
# (/api/keystatic/*). The redirect below is the SPA fallback so deep links into
# the client-only admin (e.g. /keystatic/collection/posts_en) load the app shell.

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/keystatic/*"
  to = "/keystatic/index.html"
  status = 200
